const TSL={en:[["📱 What the screen looks like","The screen has three zones: ① the header, with your team’s indicators and the ☰ Menu button; ② the central area, with the options of the chosen section; ③ the bottom menu, with the team’s different sections. The floating ④ “Next week” button moves time forward. Many features unlock after each diada (or all from the start if you enable it at the beginning)."],["📊 The header: indicators","Where: at the very top. 💰 money · 👥 members/capacity · 😊 morale · 😮‍💨 fatigue · 🎖️ leader’s prestige · 💪 stamina · 🏠 landlords’ happiness · ⭐ points and ranking position · ⚡ actions left this week."],["🧭 The bottom menu","Where: at the very bottom. 🗓 Week (rehearsals, stamina, rest, events) · 🏠 Venue (upgrades and landlords) · 🤝 Sponsors · ✖ Social · 🏆 Trophies · 📊 Ranking · 📜 Rules. Some sections appear when the team has more members."],["🏰 The goal","You run a castell team for 36 weeks. Each week you have 1 to 5 actions (⚡). When they are used up, press the floating “Next week” button. Every 4 weeks there is a diada."],["🧱 Rehearsals","Where: 🗓 Week → “Rehearse castells”. Rehearsing a castell raises its reliability; hard ones (high and extra tier) cost more. Castells you don’t rehearse lose 1 point a week. “Basics and pinya” prevents that and raises all by 1%. Rehearsals can fail."],["😮‍💨 Fatigue and stamina","Where: 🗓 Week → “Stamina” and “Rest”. Every rehearsal adds fatigue, which lowers success and progress. Rest or train stamina to cope better with diades."],["🎪 The diades","Where: every 4 weeks the diada opens by itself. Pick castells according to who showed up. Completed gives full points, loaded 65%, a failed attempt none. Repeating a castell reduces its value. Every attempt adds reliability when the diada ends. Buses reduce fatigue."],["🏆 Ranking and prizes","Where: 📊 Ranking. The top 10 collas qualify for Santa Tecla and the Tarragona Contest. At the end of the season the top 3 receive prizes and sponsorship."],["🏠 The venue","Where: 🏠 Venue. Buy upgrades with benefits. Keep the landlords happy: if their happiness reaches 0 you are evicted and lose the upgrades."],["🔓 Unlockable options","After each diada new actions, rules, sponsors, grants and social media unlock. A pop-up explains what each option does and where to find it. Balance rehearsals and rest, look after morale and watch your money!"]],
es:[["📱 Cómo es la pantalla","La pantalla tiene tres zonas: ① la cabecera, con los indicadores de la colla y el botón ☰ Menú; ② la zona central, con las opciones del apartado elegido; ③ el menú inferior, con los distintos apartados de la colla. El botón flotante ④ «Siguiente semana» hace avanzar el tiempo. Muchas funciones se desbloquean tras cada diada (o todas desde el principio, si lo activas al inicio)."],["📊 La cabecera: indicadores","Dónde: arriba del todo. 💰 dinero · 👥 miembros/capacidad · 😊 moral · 😮‍💨 fatiga · 🎖️ prestigio del jefe de colla · 💪 resistencia · 🏠 felicidad de los propietarios · ⭐ puntos y posición en la clasificación · ⚡ acciones que te quedan esta semana."],["🧭 El menú inferior","Dónde: abajo del todo. 🗓 Semana (ensayos, resistencia, descanso, eventos) · 🏠 Local (mejoras y propietarios) · 🤝 Patrocinadores · ✖ Redes · 🏆 Trofeos · 📊 Clasificación · 📜 Normas. Algunos apartados aparecen cuando la colla tiene más miembros."],["🏰 El objetivo","Diriges una colla castellera durante 36 semanas. Cada semana tienes entre 1 y 5 acciones (⚡). Cuando las gastas, pulsa el botón flotante «Siguiente semana». Cada 4 semanas hay una diada."],["🧱 Ensayos","Dónde: 🗓 Semana → «Ensayar castells». Ensayar un castell sube su fiabilidad; los difíciles (gama alta y extra) cuestan más. Los que no ensayas pierden 1 punto por semana. «Básicos y piña» lo evita y sube todos un 1%. Los ensayos pueden fallar."],["😮‍💨 Fatiga y resistencia","Dónde: 🗓 Semana → «Resistencia» y «Descanso». Cada ensayo suma fatiga, que reduce el éxito y el progreso. Descansa o entrena la resistencia para aguantar mejor las diades."],["🎪 Las diades","Dónde: cada 4 semanas la diada se abre sola. Elige castells según la gente que ha venido. Descargado da todos los puntos, cargado un 65% y un intento ninguno. Repetir un castell resta valor. Todos los intentos suman fiabilidad al acabar la diada. Los autobuses reducen la fatiga."],["🏆 Clasificación y premios","Dónde: 📊 Clasificación. Las 10 primeras colles se clasifican para Santa Tecla y el Concurs de Tarragona. Al final de la temporada, los 3 primeros reciben premios y patrocinios."],["🏠 El local","Dónde: 🏠 Local. Compra mejoras con ventajas. Cuida a los propietarios: si su felicidad llega a 0, te echan y pierdes las mejoras."],["🔓 Opciones que se desbloquean","Tras cada diada se desbloquean nuevas acciones, normas, patrocinadores, subvenciones y redes. Un pop-up te explica qué hace cada opción y dónde encontrarla. ¡Equilibra ensayos y descanso, cuida la moral y vigila el dinero!"]]};
const THL={en:{w:"Each week you have limited ⚡ actions (1–5). Rehearse castells (reliability goes up), hold events or rest. When done, press “Next week”. Every 4 weeks there is a diada.",l:"Buy venue upgrades: each level gives benefits. Look after the landlords: if their happiness reaches 0 you are evicted.",s:"Sponsors pay in specific weeks and contracts expire. You have 2 attempts per company; the more prestige, the better the sponsors.",x:"Post on social media to attract people. Beware of controversy and reports: if you get caught, you pay dearly.",t:"Here you keep the cups from diades you won and the achievements you earned.",r:"The top 10 collas qualify for Santa Tecla and the Tarragona Contest. At the end of the season, the top 3 receive prizes.",n:"Rules apply every week while active. All of them have pros and cons."},es:{w:"Cada semana tienes ⚡ acciones limitadas (1–5). Ensaya castells (sube la fiabilidad), haz eventos o descansa. Al acabar, pulsa «Siguiente semana». Cada 4 semanas hay una diada.",l:"Compra mejoras del local: cada nivel da ventajas. Cuida a los propietarios: si su felicidad llega a 0 te echan.",s:"Los patrocinadores pagan en semanas concretas y los contratos caducan. Tienes 2 intentos por empresa; con más prestigio, mejores patrocinadores.",x:"Publica en redes para atraer gente. Cuidado con la polémica y las denuncias: si te pillan, lo pagas caro.",t:"Aquí guardas las copas de las diades ganadas y los hitos conseguidos.",r:"Las 10 primeras colles se clasifican para Santa Tecla y el Concurs de Tarragona. Al final de la temporada, los 3 primeros reciben premios.",n:"Las normas se aplican cada semana mientras estén activas. Todas tienen ventajas e inconvenientes."}};
